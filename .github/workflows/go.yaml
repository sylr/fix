---
name: Go
on:
  pull_request:
  push:
    branches:
    - master

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Verify go mod
      run: make go-mod-verify

    - name: Verify generated code
      run: make generate-verify

    - name: Vet
      run: go vet -tags acceptor,validator ./...

    - name: Vuln check
      run: make vuln

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --build-tags acceptor,validator

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      run: make test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build
      run: make build

    - name: Build without cgo
      run: CGO_ENABLED=0 go build -tags acceptor,validator ./...

    - name: Build without tags
      run: go build ./...
